name: family_circle
description: "Production-oriented self-hosted Family Location Tracking System Android App"
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  # State Management
  flutter_riverpod: ^2.5.1

  # Networking & Real-time
  dio: ^5.4.3+1
  socket_io_client: ^3.0.0

  # Routing
  go_router: ^14.1.4

  # Secure Storage & SQLite Offline Queue
  flutter_secure_storage: ^9.2.1
  sqflite: ^2.3.3+1
  path: ^1.9.0

  # Map & Geolocation
  flutter_map: ^6.1.0
  latlong2: ^0.9.1
  geolocator: ^11.0.0

  # Notifications & Device Info
  flutter_local_notifications: ^17.1.2
  device_info_plus: ^10.1.0
  battery_plus: ^6.0.1
  url_launcher: ^6.2.6

  # UI Utilities
  intl: ^0.19.0
  uuid: ^4.4.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
